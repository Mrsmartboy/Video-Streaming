

services:
  db:
    image: postgres:15-alpine
    container_name: lms-postgres
    restart: always
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: password
      POSTGRES_DB: lms_streaming
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: lms-redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  minio:
    image: minio/minio
    container_name: lms-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

  backend-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend-api
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - DATABASE_URL=postgresql://root:password@db:5432/lms_streaming?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_RAW_BUCKET=lms-raw-videos
      - MINIO_PROCESSED_BUCKET=lms-processed-videos
      - JWT_SECRET=super-secret-jwt-token-key-change-in-prod
      - FRONTEND_URL=http://localhost:5173
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
      - minio

  backend-worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lms-backend-worker
    restart: always
    command: npm run start:worker
    environment:
      - NODE_ENV=development
      - DATABASE_URL=postgresql://root:password@db:5432/lms_streaming?schema=public
      - REDIS_URL=redis://redis:6379
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - MINIO_RAW_BUCKET=lms-raw-videos
      - MINIO_PROCESSED_BUCKET=lms-processed-videos
      - JWT_SECRET=super-secret-jwt-token-key-change-in-prod
    volumes:
      - ./backend:/app
      - /app/node_modules
    depends_on:
      - db
      - redis
      - minio

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: lms-frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend-api

volumes:
  pgdata:
  redisdata:
  miniodata:
